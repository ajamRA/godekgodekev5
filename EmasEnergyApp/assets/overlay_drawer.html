<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>e.MAS EV Floating Overlay</title>
  <link rel="stylesheet" href="flat-cockpit.css">
  <style>
    *, *:before, *:after { box-sizing: border-box; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .items-baseline { align-items: baseline; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .justify-end { justify-content: flex-end; }
    .justify-start { justify-content: flex-start; }
    .gap-1 { gap: 4px; }
    .gap-1\.5 { gap: 6px; }
    .gap-2 { gap: 8px; }
    .grid { display: grid; }
    .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-cols-8 { grid-template-columns: repeat(8, minmax(0, 1fr)); }
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    .block { display: block; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .rounded-xl { border-radius: 12px; }
    .rounded-2xl { border-radius: 16px; }
    .rounded-full { border-radius: 9999px; }
    .p-2 { padding: 8px; }
    .p-2\.5 { padding: 10px; }
    .p-4 { padding: 16px; }
    .my-1 { margin-top: 4px; margin-bottom: 4px; }
    .my-2 { margin-top: 8px; margin-bottom: 8px; }
    .my-2\.5 { margin-top: 10px; margin-bottom: 10px; }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .pb-2 { padding-bottom: 8px; }
    .pb-2\.5 { padding-bottom: 10px; }
    .pt-2 { padding-top: 8px; }
    body {
      background: transparent !important;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Night mode (Obsidian Slate OEM) */
    body.theme-night .overlay-card {
      background: rgba(14, 20, 27, 0.96) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      color: #F3F4F6 !important;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.8) !important;
    }
    body.theme-night .theme-panel {
      background: rgba(22, 30, 41, 0.85) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      color: #F3F4F6 !important;
    }
    body.theme-night .theme-input-box {
      background: #0E151E !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: #FFFFFF !important;
    }

    /* Day mode (Clean Light Grey Pearl OEM) */
    body.theme-day .overlay-card {
      background: rgba(243, 244, 246, 0.97) !important;
      border: 1px solid rgba(0, 0, 0, 0.12) !important;
      color: #111827 !important;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.25) !important;
    }
    body.theme-day .theme-panel {
      background: rgba(255, 255, 255, 0.95) !important;
      border: 1px solid rgba(0, 0, 0, 0.08) !important;
      color: #111827 !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04) !important;
    }
    body.theme-day .theme-input-box {
      background: #F0F2F5 !important;
      border: 1px solid rgba(0, 0, 0, 0.08) !important;
      color: #111827 !important;
    }
    body.theme-day .text-white { color: #111827 !important; }
    body.theme-day .text-white\/60 { color: #4B5563 !important; }
    body.theme-day .text-white\/50 { color: #6B7280 !important; }
    body.theme-day .text-white\/40 { color: #9CA3AF !important; }
    body.theme-day .text-white\/70 { color: #374151 !important; }
    body.theme-day .border-white\/10 { border-color: rgba(0, 0, 0, 0.1) !important; }
    body.theme-day .border-white\/5 { border-color: rgba(0, 0, 0, 0.06) !important; }
    body.theme-day .bg-white\/10 { background-color: rgba(0, 0, 0, 0.06) !important; color: #1F2937 !important; }
    body.theme-day .bg-\[\#14202b\] { background-color: #E5E7EB !important; color: #111827 !important; border-color: rgba(0,0,0,0.1) !important; }
    body.theme-day #soc-display { color: #111827 !important; }
    body.theme-day .text-emerald-500 { color: #059669 !important; }
    body.theme-day .text-cyan-400, body.theme-day .text-cyan-500 { color: #0284C7 !important; }
    body.theme-day button.theme-input-box { color: #111827 !important; }
    body.theme-day #cm-quick_cool span, body.theme-day #cm-comfort span, body.theme-day #cm-off span { color: #1F2937 !important; }
    body.theme-day #temp-val { color: #111827 !important; }

    .overlay-card {
      border-radius: 24px;
      padding: 16px;
      margin: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: calc(100vh - 16px);
      box-sizing: border-box;
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    .power-btn-on {
      background: rgba(16, 185, 129, 0.18) !important;
      border: 1px solid rgba(16, 185, 129, 0.45) !important;
      color: #059669 !important;
    }
    body.theme-night .power-btn-on {
      color: #6ee7b7 !important;
    }
    .power-btn-off {
      background: rgba(244, 63, 94, 0.25) !important;
      border: 1px solid rgba(244, 63, 94, 0.5) !important;
      color: #e11d48 !important;
    }
    body.theme-night .power-btn-off {
      color: #fecdd3 !important;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.3); border-radius: 4px; }
  </style>
</head>
<body class="text-white theme-day">

  <div class="overlay-card" id="overlay-container">
    
    <!-- TOP HEADER -->
    <div class="flex items-center justify-between pb-2.5 border-b border-white/10">
      <div class="flex items-center gap-2">
        <span class="w-6 h-6 rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-xs font-bold">⚡</span>
        <span class="text-xs font-extrabold tracking-wider text-emerald-400 uppercase">EV & A/C OVERLAY</span>
        <span id="countdown-badge" class="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-white/10 text-white/80">8s</span>
      </div>
      <button onclick="window.closeOverlay()" class="px-3 py-1 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 text-white text-xs font-bold transition-all">
        ✕ Tutup
      </button>
    </div>

    <!-- 1. HIGH VOLTAGE BATTERY CLUSTER -->
    <div class="cockpit-battery theme-panel glass-panel rounded-2xl p-4 flex flex-col justify-between">
      <div class="flex items-center justify-between pb-2 border-b border-white/5">
        <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-500">Pek Bateri Voltan Tinggi</span>
        <span class="text-xs font-mono text-white/60" id="pack-electrical">— V · — A</span>
      </div>

      <!-- Big SoC & Power kW -->
      <div class="my-2.5 flex items-center justify-between">
        <div>
          <div class="flex items-baseline gap-1.5">
            <span class="text-4xl font-extrabold font-mono text-white tracking-tight" id="soc-display">—</span>
            <span class="text-xl font-bold text-emerald-500">%</span>
          </div>
          <span class="text-[11px] font-medium text-white/60 block mt-0.5">Jarak: <b class="text-white" id="range-display">— km</b></span>
        </div>

        <div class="text-right">
          <span class="text-[10px] font-bold uppercase tracking-wider text-cyan-500 block" id="power-mode-label">Kuasa Semasa</span>
          <div class="flex items-baseline justify-end gap-1 my-0.5">
            <span class="text-2xl font-extrabold font-mono text-cyan-400" id="power-display">—</span>
            <span class="text-sm font-bold text-cyan-500">kW</span>
          </div>
          <span class="text-[10px] text-white/50 font-mono" id="speed-display">— km/j</span>
        </div>
      </div>

      <!-- Dual Ribbon -->
      <div class="space-y-1">
        <div class="h-2 w-full bg-[#080d11] rounded-full p-0.5 flex overflow-hidden border border-white/5">
          <div class="w-1/2 flex justify-end">
            <div id="ribbon-regen" class="bg-gradient-to-l from-emerald-500 to-teal-300 h-full rounded-l-full w-[0%]"></div>
          </div>
          <div class="w-1/2 flex justify-start">
            <div id="ribbon-traction" class="bg-gradient-to-r from-cyan-500 to-blue-400 h-full rounded-r-full w-[0%] shadow-sm shadow-cyan-400/50"></div>
          </div>
        </div>
        <div class="flex justify-between text-[8px] font-mono text-white/40">
          <span>◀ REGEN</span>
          <span>0 kW</span>
          <span>TRAKSI ▶</span>
        </div>
      </div>

      <!-- Trip -->
      <div class="mt-2 pt-2 border-t border-white/5 flex items-center justify-between text-xs">
        <div class="flex items-center gap-1.5">
          <span class="text-white/60 text-[11px]">Trip:</span>
          <b class="font-mono text-white text-xs" id="trip-readout">— km</b>
        </div>
        <button onclick="window.resetTrip()" class="px-2.5 py-0.5 rounded-lg bg-[#14202b] hover:bg-[#1a2c3c] text-emerald-500 text-[11px] font-bold transition-all border border-emerald-500/20 active:scale-95">
          Reset trip
        </button>
      </div>
    </div>

    <!-- 2. SMART CLIMATE CONTROL -->
    <div class="cockpit-climate theme-panel glass-panel rounded-2xl p-4 flex flex-col justify-between">
      <div class="flex items-center justify-between pb-2 border-b border-white/5">
        <div class="flex items-center gap-1.5">
          <span class="text-xs font-mono font-bold text-white/70">A/C</span>
          <h3 class="text-xs font-bold text-white tracking-tight">Smart Climate</h3>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="window.toggleClimatePower()" id="btn-climate-power" class="px-2.5 py-1 rounded-xl text-xs font-bold power-btn-on active:scale-95 transition-all flex items-center gap-1.5 cursor-pointer shadow-sm">
            <span class="text-xs">⏻</span> <span id="climate-power-text">A/C ON</span>
          </button>
          <span id="climate-mode-pill" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-white/10 border border-white/20 text-white/70">
            AUTO
          </span>
        </div>
      </div>

      <!-- Profiles -->
      <div class="grid grid-cols-4 gap-1.5 my-2">
        <button onclick="window.setClimateMode('adaptive', true)" id="cm-adaptive" class="p-1.5 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-left transition-all">
          <span class="text-[10px] block font-bold text-emerald-500">Adaptive</span>
          <span class="text-[8px] text-white/50 block">Ikut cuaca</span>
        </button>
        <button onclick="window.setClimateMode('quick_cool', true)" id="cm-quick_cool" class="p-1.5 rounded-xl theme-input-box border border-white/10 text-left transition-all">
          <span class="text-[10px] block font-bold text-white">Quick Cool</span>
          <span class="text-[8px] text-white/50 block">Sejuk pantas</span>
        </button>
        <button onclick="window.setClimateMode('comfort', true)" id="cm-comfort" class="p-1.5 rounded-xl theme-input-box border border-white/10 text-left transition-all">
          <span class="text-[10px] block font-bold text-white">Comfort</span>
          <span class="text-[8px] text-white/50 block">Senyap 22°C</span>
        </button>
        <button onclick="window.setClimateMode('off', false)" id="cm-off" class="p-1.5 rounded-xl theme-input-box border border-white/10 text-left transition-all">
          <span class="text-[10px] block font-bold text-white">Manual</span>
          <span class="text-[8px] text-white/50 block">Manual</span>
        </button>
      </div>

      <!-- Controls: Temp & Fan -->
      <div class="grid grid-cols-2 gap-2 mt-1">
        <!-- Temp -->
        <div class="theme-input-box p-2 rounded-xl border border-white/10 flex flex-col justify-between">
          <span class="text-[9px] uppercase tracking-wider text-white/50 font-bold">Suhu Kabin</span>
          <div class="flex items-center justify-between my-1">
            <button onclick="window.adjustTemp(-0.5)" class="w-7 h-7 rounded-lg bg-[#14202b] hover:bg-[#1e3040] active:scale-90 text-white font-bold flex items-center justify-center transition-all text-xs border border-white/10">－</button>
            <div class="flex items-baseline gap-0.5">
              <span class="text-xl font-bold font-mono text-white" id="temp-val">19.0</span>
              <span class="text-xs text-white/60 font-bold">°C</span>
            </div>
            <button onclick="window.adjustTemp(0.5)" class="w-7 h-7 rounded-lg bg-[#14202b] hover:bg-[#1e3040] active:scale-90 text-white font-bold flex items-center justify-center transition-all text-xs border border-white/10">＋</button>
          </div>
        </div>

        <!-- Fan -->
        <div class="theme-input-box p-2 rounded-xl border border-white/10 flex flex-col justify-between">
          <div class="flex items-center justify-between">
            <span class="text-[9px] uppercase tracking-wider text-white/50 font-bold">Kipas Blower</span>
            <span class="text-[10px] font-mono text-emerald-500 font-bold" id="fan-val">Tahap 3 / 8</span>
          </div>
          <div class="grid grid-cols-8 gap-0.5 my-1">
            <button onclick="window.setFanSpeed(1)" class="fan-dot h-6 rounded bg-emerald-500 text-white font-bold text-[9px]" data-f="1">1</button>
            <button onclick="window.setFanSpeed(2)" class="fan-dot h-6 rounded bg-emerald-500 text-white font-bold text-[9px]" data-f="2">2</button>
            <button onclick="window.setFanSpeed(3)" class="fan-dot h-6 rounded bg-emerald-500 text-white font-bold text-[9px]" data-f="3">3</button>
            <button onclick="window.setFanSpeed(4)" class="fan-dot h-6 rounded bg-[#14202b] text-white/50 font-bold text-[9px]" data-f="4">4</button>
            <button onclick="window.setFanSpeed(5)" class="fan-dot h-6 rounded bg-[#14202b] text-white/50 font-bold text-[9px]" data-f="5">5</button>
            <button onclick="window.setFanSpeed(6)" class="fan-dot h-6 rounded bg-[#14202b] text-white/50 font-bold text-[9px]" data-f="6">6</button>
            <button onclick="window.setFanSpeed(7)" class="fan-dot h-6 rounded bg-[#14202b] text-white/50 font-bold text-[9px]" data-f="7">7</button>
            <button onclick="window.setFanSpeed(8)" class="fan-dot h-6 rounded bg-[#14202b] text-white/50 font-bold text-[9px]" data-f="8">8</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. WINDOW QUICK CONTROLS -->
    <div class="theme-panel rounded-2xl p-2.5 border border-white/10 flex items-center justify-between">
      <span class="text-[10px] font-bold text-white/70 uppercase tracking-wider">Tingkap</span>
      <div class="flex items-center gap-1.5">
        <button onclick="window.controlWindow('crack')" class="px-2.5 py-1 rounded-lg bg-[#14202b] hover:bg-[#1a2c3c] text-white text-[10px] font-bold border border-white/10 active:scale-95 transition-all">
          Celah 5%
        </button>
        <button onclick="window.controlWindow('close')" class="px-2.5 py-1 rounded-lg bg-[#14202b] hover:bg-[#1a2c3c] text-white text-[10px] font-bold border border-white/10 active:scale-95 transition-all">
          Tutup Rapat
        </button>
      </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="bg-[#0e1720] border border-emerald-500/40 text-emerald-300 px-3 py-1.5 rounded-xl text-[11px] font-bold text-center opacity-0 pointer-events-none transition-all duration-300">
      Pemberitahuan
    </div>

  </div>

  <script src="vehicle-client.js"></script>
  <script>
    const vehicleClient = SafeVehicle.createClient(window);
    const $ = id => document.getElementById(id);
    let state = {
      soc: null, voltage: null, current: null, powerKw: null,
      rangeKm: null, speed: null, tripKm: null, setpoint: 22.0,
      fan: 3, fanOff: false, autoClimateEnabled: true, autoClimateMode: 'adaptive'
    };

    let countdown = 8;
    let countdownInterval = null;

    function resetCountdown() {
      countdown = 8;
      updateBadge();
      if (countdownInterval) clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        countdown--;
        updateBadge();
        if (countdown <= 0) {
          clearInterval(countdownInterval);
          countdownInterval = null;
          window.closeOverlay();
        }
      }, 1000);
    }
    window.resetCountdown = resetCountdown;

    function updateBadge() {
      const b = $('countdown-badge');
      if (b) b.textContent = `${countdown}s`;
    }

    window.setTheme = function(theme) {
      if (theme === 'night') {
        document.body.classList.remove('theme-day');
        document.body.classList.add('theme-night');
      } else {
        document.body.classList.remove('theme-night');
        document.body.classList.add('theme-day');
      }
    };

    window.closeOverlay = function() {
      if (countdownInterval) clearInterval(countdownInterval);
      if (window.AndroidOverlay && window.AndroidOverlay.closeDrawer) {
        window.AndroidOverlay.closeDrawer();
      }
    };

    function notifyInteraction() {
      resetCountdown();
      if (window.AndroidOverlay && window.AndroidOverlay.resetTimer) {
        window.AndroidOverlay.resetTimer();
      }
    }
    ['pointerdown', 'touchstart', 'mousedown', 'click'].forEach(evt => {
      document.addEventListener(evt, notifyInteraction, { passive: true });
    });

    function toast(msg) {
      const el = $('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.remove('opacity-0', 'pointer-events-none');
      el.classList.add('opacity-100');
      clearTimeout(window.tTimer);
      window.tTimer = setTimeout(() => {
        el.classList.remove('opacity-100');
        el.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }

    function hasNumber(v) {
      return v !== null && v !== undefined && Number.isFinite(Number(v));
    }

    function updateUI() {
      // Electrical
      if ($('pack-electrical')) {
        const v = hasNumber(state.voltage) ? Number(state.voltage).toFixed(1) : '—';
        const a = hasNumber(state.current) ? Number(state.current).toFixed(1) : '—';
        $('pack-electrical').textContent = `${v} V · ${a} A`;
      }
      if ($('soc-display')) $('soc-display').textContent = hasNumber(state.soc) ? Math.round(Number(state.soc)) : '—';
      if ($('range-display')) $('range-display').textContent = hasNumber(state.rangeKm) ? `${Math.round(Number(state.rangeKm))} km` : '— km';

      // Power
      if ($('power-display')) {
        const p = hasNumber(state.powerKw) ? Number(state.powerKw) : 0;
        $('power-display').textContent = (p >= 0 ? '+' : '') + p.toFixed(1);
      }
      if ($('speed-display')) $('speed-display').textContent = hasNumber(state.speed) ? `${Math.round(Number(state.speed))} km/j` : '— km/j';

      // Ribbons
      const p = hasNumber(state.powerKw) ? Number(state.powerKw) : 0;
      if ($('ribbon-regen')) $('ribbon-regen').style.width = p < 0 ? Math.min(100, (Math.abs(p) / 60) * 100) + '%' : '0%';
      if ($('ribbon-traction')) $('ribbon-traction').style.width = p > 0 ? Math.min(100, (p / 120) * 100) + '%' : '0%';

      // Trip
      const raw = hasNumber(state.tripKm) ? Number(state.tripKm) : null;
      const offset = parseFloat(localStorage.getItem('customTripOffsetKm') || '0');
      const dispTrip = raw === null ? '—' : Math.max(0, raw - offset).toFixed(1);
      if ($('trip-readout')) $('trip-readout').textContent = `${dispTrip} km`;

      // Climate
      if ($('temp-val')) $('temp-val').textContent = hasNumber(state.setpoint) ? Number(state.setpoint).toFixed(1) : '—';
      if ($('fan-val')) {
        $('fan-val').textContent = state.fanOff ? 'MATI (OFF)' : (hasNumber(state.fan) ? `Tahap ${Number(state.fan)} / 8` : '— / 8');
      }

      // Climate Power Button
      const pwrBtn = $('btn-climate-power');
      const pwrTxt = $('climate-power-text');
      if (pwrBtn && pwrTxt) {
        if (state.fanOff) {
          pwrBtn.className = 'px-2.5 py-1 rounded-xl text-xs font-bold power-btn-off active:scale-95 transition-all flex items-center gap-1.5 cursor-pointer shadow-sm';
          pwrTxt.textContent = 'A/C OFF';
        } else {
          pwrBtn.className = 'px-2.5 py-1 rounded-xl text-xs font-bold power-btn-on active:scale-95 transition-all flex items-center gap-1.5 cursor-pointer shadow-sm';
          pwrTxt.textContent = 'A/C ON';
        }
      }

      // Fan dots
      document.querySelectorAll('.fan-dot').forEach(btn => {
        const f = parseInt(btn.getAttribute('data-f'));
        if (!state.fanOff && hasNumber(state.fan) && f <= Number(state.fan)) {
          btn.className = 'fan-dot h-6 rounded bg-emerald-400 text-black font-bold text-[9px]';
        } else {
          btn.className = 'fan-dot h-6 rounded bg-[#14202b] text-white/50 font-bold text-[9px]';
        }
      });

      // Mode pill
      const pill = $('climate-mode-pill');
      if (pill) {
        if (!state.autoClimateEnabled || state.autoClimateMode === 'off') {
          pill.textContent = 'MANUAL';
          pill.className = 'px-2 py-0.5 rounded-full text-[10px] font-bold bg-white/10 border border-white/20 text-white/70';
        } else {
          pill.textContent = `${state.autoClimateMode.toUpperCase()} AUTO`;
          pill.className = 'px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/15 border border-emerald-500/30 text-emerald-400';
        }
      }

      ['adaptive', 'quick_cool', 'comfort', 'off'].forEach(m => {
        const btn = $('cm-' + m);
        if (btn) {
          const isSel = (m === 'off' && !state.autoClimateEnabled) || (state.autoClimateEnabled && state.autoClimateMode === m);
          if (isSel) {
            btn.className = 'p-1.5 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-left transition-all';
            btn.querySelector('span:first-child').className = 'text-[10px] block font-bold text-emerald-300';
          } else {
            btn.className = 'p-1.5 rounded-xl bg-[#0c141c] border border-white/10 text-left transition-all';
            btn.querySelector('span:first-child').className = 'text-[10px] block font-bold text-white';
          }
        }
      });
    }

    async function vehicleRequest(path, method = 'GET', body = null) {
      return vehicleClient.request(method, path, body ? JSON.stringify(body) : '');
    }

    async function pollTelemetry() {
      try {
        const res = await vehicleRequest('/api/energy');
        if (res && res.ok === true) {
          const batt = res.battery || {};
          const trip = res.trip || {};
          const hvac = res.hvac || {};
          const smart = res.smart_climate || {};

          if (batt.soc_pct !== undefined) state.soc = batt.soc_pct;
          else if (res.soc_pct !== undefined) state.soc = res.soc_pct;

          if (batt.voltage_v !== undefined) state.voltage = batt.voltage_v;
          else if (res.voltage !== undefined) state.voltage = res.voltage;

          if (batt.current_a !== undefined) state.current = batt.current_a;
          else if (res.current !== undefined) state.current = res.current;

          if (batt.power_kw !== undefined) state.powerKw = batt.power_kw;
          else if (res.motor_power_kw !== undefined) state.powerKw = res.motor_power_kw;

          if (batt.range_km !== undefined) state.rangeKm = batt.range_km;
          else if (res.range_km !== undefined) state.rangeKm = res.range_km;

          if (res.speed_kmh !== undefined) state.speed = res.speed_kmh;
          else if (res.speed !== undefined) state.speed = res.speed;

          if (trip.distance_km !== undefined) state.tripKm = trip.distance_km;

          if (hvac.setpoint !== undefined) state.setpoint = hvac.setpoint;
          else if (hvac.tempDrv !== undefined) state.setpoint = hvac.tempDrv;

          if (hvac.fan !== undefined) state.fan = hvac.fan;
          if (hvac.powerOn !== undefined) state.fanOff = !hvac.powerOn;
          else if (hvac.power !== undefined) state.fanOff = hvac.power === 0;

          if (hvac.auto_enabled !== undefined) state.autoClimateEnabled = !!hvac.auto_enabled;
          else if (smart.enabled !== undefined) state.autoClimateEnabled = !!smart.enabled;

          if (hvac.auto_mode !== undefined) state.autoClimateMode = hvac.auto_mode;
          else if (smart.mode !== undefined) state.autoClimateMode = smart.mode;
        }
        updateUI();
      } catch (_) {
        updateUI();
      }
    }

    // Public Actions
    window.toggleClimatePower = async function() {
      const isCurrentlyOn = !state.fanOff;
      const targetState = isCurrentlyOn ? 0 : 1;
      toast(isCurrentlyOn ? 'Mematikan Aircond…' : 'Menghidupkan Aircond…');
      const res = await vehicleRequest(`/api/climate/power?state=${targetState}`);
      if (res && res.ok === true) {
        state.fanOff = (targetState === 0);
        updateUI();
        toast(targetState === 0 ? '✓ Aircond dimatikan (OFF)' : '✓ Aircond dihidupkan (ON)');
      } else {
        toast('Gagal menukar kuasa A/C ⚠️');
      }
    };

    window.adjustTemp = async function(delta) {
      const cur = state.setpoint !== null ? state.setpoint : 22.0;
      const target = Math.max(17.0, Math.min(32.0, Math.round((cur + delta) * 2) / 2));
      toast(`Suhu sasaran: ${target.toFixed(1)}°C…`);
      const res = await vehicleRequest(`/api/climate/temp?target=${target.toFixed(1)}`);
      if (res && res.ok === true) {
        state.setpoint = target;
        updateUI();
      }
    };

    window.setFanSpeed = async function(speed) {
      const lvl = Math.max(1, Math.min(8, parseInt(speed, 10)));
      toast(`Kipas Tahap ${lvl}…`);
      const res = await vehicleRequest(`/api/climate/fan?level=${lvl}`);
      if (res && res.ok === true) {
        state.fan = lvl;
        state.fanOff = false;
        updateUI();
      }
    };

    window.setClimateMode = async function(mode, enabled) {
      toast(`Smart Climate: ${mode}…`);
      const res = await vehicleRequest(`/api/climate/auto?mode=${encodeURIComponent(mode)}&enabled=${enabled}`);
      if (res && res.ok === true) {
        state.autoClimateEnabled = enabled;
        state.autoClimateMode = mode;
        updateUI();
      }
    };

    window.controlWindow = async function(action) {
      toast(action === 'crack' ? 'Celahan tingkap 5%…' : 'Rapat tingkap…');
      await vehicleRequest(`/api/window?action=${encodeURIComponent(action)}`);
    };

    window.resetTrip = function() {
      if (!hasNumber(state.tripKm)) return;
      localStorage.setItem('customTripOffsetKm', Number(state.tripKm));
      toast('Trip di-reset ke 0.0 km! 🔄');
      updateUI();
    };

    window.onDrawerOpened = function() {
      resetCountdown();
      pollTelemetry();
    };

    window.addEventListener('DOMContentLoaded', () => {
      resetCountdown();
      pollTelemetry();
      setInterval(pollTelemetry, 1500);
    });
  </script>
</body>
</html>
